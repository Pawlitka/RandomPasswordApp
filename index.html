<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title id="title">Random Password Generator</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <h1 id="headerPrefix">Generate a</h1>
            <h1><span id="headerSuffix">RANDOM PASSWORD</span></h1>
            <div class="display">
                <input type="text" id="password" placeholder="password"/>
                <img src="copy.png" alt="copy.png" onclick="handleClickCopyPassword()"/>
            </div>
            <button onclick="handleClickButtonGeneratePassword()">
                <img src="generate.png" alt="generate.png"/>
                <span id="buttonGeneratePassword">generate password</span>
            </button>
        </div>
        <div class="checkbox-container">
            <div class="checkbox-list">
                <h2 id="checkbox-title">Password length</h2>
                <label>
                    <ul>
                    <input type="checkbox" class="checkbox"/>
                    <span>8</span>
                    </ul>
                </label>
                <label>
                    <ul>
                    <input type="checkbox" class="checkbox"/>
                    <span>12</span>
                    </ul>
                </label>
                <label>
                    <ul>
                    <input type="checkbox" class="checkbox"/>
                    <span>16</span>
                    </ul>
                </label>
                <label>
                    <input type="text" class="value-box" placeholder="Your value"/>
                </label>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
